# Источник правды по событиям (PDA 4.4, патч 9.4).
# Из этого файла генерируются типы событий и схемы валидации.
# Ручное объявление типа события в коде — ошибка сборки (S-3).
# Изменение схемы существующего события — только через version + 1.

meta:
  schema: pda-event-registry/1
  project: tg-progress-bot
  owner: max

envelope:
  event_id: uuid
  event_type: string
  occurred_at: timestamp
  actor: { id: string, role: string }
  subject: { entity: string, id: string }
  payload: object
  causation_id: uuid | null
  correlation_id: uuid | null
  idempotency_key: string | null
  schema_version: int

events:
  - type: task.created
    version: 1
    context: tasks
    actor: user
    subject: Task
    payload:
      task_id: string
      project_id: string
      issue_id: string
      title: string
      assignee_id: string
      priority: enum[high, normal, low]
      target: enum[today, plan]
    idempotency_key: "callback_query_id"
    invariants: [INV-01, INV-02, INV-03, INV-12, INV-15]
    projections: [today_list, plan_queue, project_progress]
    owner: max

  - type: task.prioritized
    version: 1
    context: tasks
    actor: user
    subject: Task
    payload:
      task_id: string
      priority: enum[high, normal, low]
      previous_priority: enum[high, normal, low]
    idempotency_key: "callback_query_id"
    invariants: [INV-12, INV-15]
    projections: [plan_queue, project_progress]
    owner: max

  - type: task.reassigned
    version: 1
    context: tasks
    actor: user
    subject: Task
    payload:
      task_id: string
      assignee_id: string
      previous_assignee_id: string
    idempotency_key: "callback_query_id"
    invariants: [INV-02, INV-12]
    projections: [today_list, in_progress_board]
    owner: max

  - type: task.postponed
    version: 1
    context: tasks
    actor: user
    subject: Task
    payload:
      task_id: string
      from_list_id: string | null
    idempotency_key: "callback_query_id"
    invariants: [INV-03, INV-14]
    projections: [today_list, plan_queue]
    owner: max

  - type: task.checked
    version: 1
    context: tasks
    actor: user
    subject: Task
    payload:
      task_id: string
      list_item_id: string
    idempotency_key: "callback_query_id"
    invariants: [INV-03, INV-05, INV-13]
    projections: [today_list, in_progress_board, project_progress]
    owner: max

  - type: task.unchecked
    version: 1
    context: tasks
    actor: user
    subject: Task
    payload:
      task_id: string
      list_item_id: string
    idempotency_key: "callback_query_id"
    invariants: [INV-03]
    projections: [today_list, in_progress_board, project_progress]
    owner: max

  - type: task.confirmed
    version: 1
    context: tasks
    actor: lead
    subject: Task
    payload:
      task_id: string
      confirmed_by: string
    idempotency_key: "task_id + ':confirmed'"
    invariants: [INV-03, INV-04, INV-05]
    projections: [done_feed, project_progress, daily_digest]
    owner: max

  - type: task.cancelled
    version: 1
    context: tasks
    actor: user
    subject: Task
    payload:
      task_id: string
      cancelled_by: string
      reason: string | null
    idempotency_key: "task_id + ':cancelled'"
    invariants: [INV-03, INV-12]
    projections: [today_list, plan_queue, project_progress]
    owner: max

  - type: task.carried_over
    version: 1
    context: tasks
    actor: system
    subject: Task
    payload:
      task_id: string
      from_list_id: string
      to_list_id: string
      day_number: int
    idempotency_key: "task_id + list_date"
    invariants: [INV-06, INV-14]
    projections: [today_list]
    owner: max

  - type: blocker.detected
    version: 1
    context: tasks
    actor: system
    subject: Blocker
    payload:
      blocker_id: string
      task_id: string
      signal_type: enum[no_check, no_issue_activity, pr_stale, ci_red, no_branch]
      detected_at: timestamp
    idempotency_key: "task_id + signal_type + detected_on_date"
    invariants: [INV-13]
    projections: [blockers_board, daily_digest]
    owner: max

  - type: blocker.declared
    version: 1
    context: tasks
    actor: user
    subject: Blocker
    payload:
      blocker_id: string
      task_id: string
      reason: string
    idempotency_key: "blocker_id + ':declared'"
    invariants: [INV-13]
    projections: [blockers_board, daily_digest, weekly_digest]
    owner: max

  - type: blocker.dismissed
    version: 1
    context: tasks
    actor: user
    subject: Blocker
    payload:
      blocker_id: string
      task_id: string
    idempotency_key: "blocker_id + ':dismissed'"
    invariants: [INV-13]
    projections: [blockers_board, in_progress_board]
    owner: max

  - type: blocker.resolved
    version: 1
    context: tasks
    actor: system
    subject: Blocker
    payload:
      blocker_id: string
      task_id: string
      resolved_by_signal: enum[checked, activity_resumed, ci_green, manual]
    idempotency_key: "blocker_id + ':resolved'"
    invariants: [INV-05, INV-13]
    projections: [blockers_board, in_progress_board]
    owner: max

  - type: project.member_added
    version: 1
    context: projects
    actor: lead
    subject: ProjectMember
    payload:
      project_id: string
      user_id: string
      role: enum[viewer, member, lead]
      topic_id: int | null
    idempotency_key: "project_id + user_id"
    invariants: [INV-12]
    projections: [access_list]
    owner: max

  - type: project.member_removed
    version: 1
    context: projects
    actor: lead
    subject: ProjectMember
    payload:
      project_id: string
      user_id: string
    idempotency_key: "project_id + user_id + removed_at"
    invariants: [INV-12]
    projections: [access_list]
    owner: max

  - type: github.issue_updated
    version: 1
    context: github
    actor: external
    subject: Issue
    payload:
      issue_id: string
      issue_number: int
      state: enum[open, closed, not_planned]
      title: string
      milestone_number: int | null
      assignee_login: string | null
    idempotency_key: "delivery_id"
    invariants: [INV-08, INV-09]
    projections: [github_state, plan_queue, project_progress]
    owner: max

  - type: github.issue_linked
    version: 1
    context: github
    actor: external
    subject: Issue
    payload:
      issue_id: string
      depends_on_issue_id: string
      link_type: enum[blocked_by, sub_issue]
      removed: boolean
    idempotency_key: "delivery_id"
    invariants: [INV-08, INV-09]
    projections: [plan_queue, blockers_board]
    owner: max

  - type: github.pull_request_updated
    version: 1
    context: github
    actor: external
    subject: PullRequest
    payload:
      pull_request_number: int
      issue_id: string | null
      state: enum[open, closed, merged]
      updated_at: timestamp
    idempotency_key: "delivery_id"
    invariants: [INV-08, INV-09]
    projections: [github_state, in_progress_board]
    owner: max

  - type: github.checks_failed
    version: 1
    context: github
    actor: external
    subject: CheckRun
    payload:
      pull_request_number: int
      conclusion: enum[failure, timed_out, cancelled]
      completed_at: timestamp
    idempotency_key: "delivery_id"
    invariants: [INV-08, INV-09]
    projections: [github_state, blockers_board]
    owner: max

  - type: github.milestone_updated
    version: 1
    context: github
    actor: external
    subject: Stage
    payload:
      milestone_number: int
      title: string
      state: enum[open, closed]
      due_on: timestamp | null
    idempotency_key: "delivery_id"
    invariants: [INV-08, INV-09]
    projections: [project_progress, plan_queue]
    owner: max

  - type: progress.snapshot_taken
    version: 1
    context: progress
    actor: system
    subject: ProgressSnapshot
    payload:
      project_id: string
      progress: float | null
      tasks_total: int
      tasks_done: int
    idempotency_key: "project_id + snapshot_date"
    invariants: [INV-10, INV-11]
    projections: [dynamics_series, daily_digest]
    owner: max

  - type: report.sent
    version: 1
    context: reports
    actor: system
    subject: ReportTarget
    payload:
      report_type: enum[daily, weekly]
      project_ids: array[string]
      destination: enum[dm, group]
      chat_id: int
      topic_id: int | null
    idempotency_key: "report_type + destination + chat_id + period_key"
    invariants: [INV-08, INV-12]
    projections: []
    owner: max
