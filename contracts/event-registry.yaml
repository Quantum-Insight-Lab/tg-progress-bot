# Источник правды по событиям (PDA 4.4; патч 1.2 — 9.4; патч 1.3 — realizes).
# Когда появится код, типы и схемы генерируются из этого файла, ручное объявление типа — ошибка сборки (S-3).
# Схема существующего события меняется только через version + 1: в журнале уже лежат факты.
# realizes — атомы ТЗ, которые событие реализует; invariants — INV из docs/pda/04-invariants.md;
# projections — проекции P-xx из docs/pda/07-architecture.md, которые событие перерисовывает.

meta:
  schema: pda-event-registry/1
  project: tg-progress-bot
  owner: max

envelope:
  event_id: uuid
  event_type: string
  occurred_at: timestamp
  actor: { id: string, role: string }
  subject: { entity: string, id: string }
  payload: object
  causation_id: uuid | null
  correlation_id: uuid | null
  idempotency_key: string
  schema_version: int

events:
  # tasks
  - type: task.created
    version: 1
    context: tasks
    actor: assignee
    subject: Task
    payload:
      task_id: string
      project_id: string
      number: int
      title: string
      assignee_id: string
      priority: enum[high, normal, low]
    idempotency_key: telegram update_id
    invariants: [INV-04, INV-05, INV-08, INV-22]
    realizes: [R-326, R-226, R-623, R-106]
    projections: [P-6, P-13]
    owner: max

  - type: task.checked
    version: 1
    context: tasks
    actor: assignee
    subject: Task
    payload:
      task_id: string
    idempotency_key: callback_query_id
    invariants: [INV-05, INV-11, INV-22]
    realizes: [R-154, R-314, R-640, R-609]
    projections: [P-6]
    owner: max

  - type: task.unchecked
    version: 1
    context: tasks
    actor: assignee
    subject: Task
    payload:
      task_id: string
    idempotency_key: callback_query_id
    invariants: [INV-05, INV-22]
