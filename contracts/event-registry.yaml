  # github — пишет только адаптер GitHub
  - type: github.issue_changed
    version: 1
    context: github
    actor: github
    subject: Issue
    payload:
      repository_id: string
      issue_number: int
      title: string
      state: enum[open, closed]
      state_reason: enum[completed, not_planned] | null
      assignees: string[]
      closed_by_login: string | null
      updated_at: timestamp
    idempotency_key: GitHub delivery id
    invariants: [INV-01, INV-21, INV-22]
    realizes: [R-344, R-347, R-069, R-094, R-338, R-339]
    projections: [P-3, P-4, P-5, P-13]
    owner: max

  - type: github.pull_request_changed
