# Реестр атомов ТЗ (PDA 1.3, 10.6). Текст атома живёт только в ТЗ, здесь — вид, релиз и решения.
# Проверяется `npm run tz:check`. Новый атом получает следующий свободный номер; номера не переиспользуются.
source: docs/tz.md

glossary:
  ветка: топик исполнителя в супергруппе проекта; «ветка исполнителя» и «топик исполнителя» — одно и то же
  топик: topic Telegram внутри супергруппы — топик исполнителя или командный топик

