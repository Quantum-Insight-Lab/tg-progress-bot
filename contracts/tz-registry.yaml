# Реестр атомов ТЗ (PDA 1.3, 10.6). Текст атома живёт только в ТЗ, здесь — вид, релиз и решения.
# Проверяется `npm run tz:check`. Новый атом получает следующий свободный номер; номера не переиспользуются.
source: docs/tz.md

glossary:
  топик: topic Telegram внутри группы — топик исполнителя (канвас и задачи) или командный топик (отчёты); слова «ветка» в этом смысле в ТЗ нет
  git-ветка: ветка репозитория GitHub; «основная git-ветка» — ветка по умолчанию
  линейка: прогресс проекта — доля completed issues репозитория и остаток открытых; «процент проекта» и «доля бэклога» — то же самое
  задача: шаг, который человек ведёт в боте; issue задачей не является и задачу не порождает
  группа: супергруппа проекта с топиками; «группа» и «супергруппа» — одно и то же
  пользователь: аккаунт Telegram, который боту известен после /start
  участник: пользователь, добавленный в проект с ролью member или lead
  руководитель: участник с ролью lead
  корень: пользователь, первым нажавший /start

