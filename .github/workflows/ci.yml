name: CI

on:
  push:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: progress
          POSTGRES_PASSWORD: progress
          POSTGRES_DB: progress_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U progress -d progress_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://progress:progress@127.0.0.1:5432/progress_bot_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run boundaries
      - run: npm run circular
      - run: npm run knip
        continue-on-error: true
      - run: npm run check:generated
      - run: npm run check:invariants
      - run: npm test
